<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RajWatch Live — Rajasthan Real-Time Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #070b14; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    @keyframes flashNew {
      0% { box-shadow: 0 0 0 2px #ef4444, 0 0 24px rgba(239,68,68,.55); background: #261019; }
      100% { box-shadow: 0 0 0 1px #1e293b; background: #0f172a; }
    }
    .new-flash { animation: flashNew 4s ease-out; }
  </style>
</head>
<body class="min-h-screen">
  <!-- Top Command Header -->
  <header class="sticky top-0 z-30 bg-[#0b1222]/95 backdrop-blur border-b border-slate-800 px-4 py-3">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="h-3 w-3 rounded-full bg-emerald-400 animate-pulse"></span>
        <div>
          <h1 class="text-lg font-bold tracking-wide text-white">RAJWATCH <span class="text-sky-400">LIVE</span></h1>
          <p class="text-[11px] text-slate-400">Open-Source Real-Time Rajasthan Media & X Radar</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2 text-xs">
        <span id="xBadge" class="px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700">Connecting...</span>
        <span class="px-2.5 py-1 rounded-full bg-slate-800 text-sky-300 border border-slate-700">
          Next Scan: <b id="timer">25</b>s
        </span>
        <button id="soundBtn" onclick="toggleSound()" class="px-3 py-1.5 rounded-lg bg-emerald-600/20 text-emerald-300 border border-emerald-500/40 font-semibold">
          Sound: ON
        </button>
        <button id="notifBtn" onclick="enableNotifications()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">
          Browser Popup
        </button>
        <button onclick="fetchFeed(true)" class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-semibold">
          Scan Now
        </button>
      </div>
    </div>

    <!-- Priority Keyword Filter Bar (Watch-Tower Style) -->
    <div class="max-w-6xl mx-auto mt-3 pt-3 border-t border-slate-800/80 flex flex-wrap items-center gap-2">
      <span class="text-xs font-semibold text-amber-400 uppercase tracking-wider mr-1">Priority Keywords:</span>
      <div id="kwChips" class="flex flex-wrap gap-1.5"></div>
      <form onsubmit="addKeyword(event)" class="flex items-center gap-1 ml-auto">
        <input id="kwInput" type="text" placeholder="Add keyword (e.g. RPSC, JDA)..."
          class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-sky-500 w-48" />
        <button class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-3 py-1 rounded-lg">+ Add</button>
      </form>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-4">
    <!-- Warning Banner if X cookies not configured -->
    <div id="xErrorBox" class="hidden mb-4 p-3 rounded-xl bg-amber-500/10 border border-amber-500/40 text-amber-200 text-xs"></div>

    <!-- Filter Controls + Stats -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <div class="flex flex-wrap gap-1.5 text-xs">
        <button onclick="setSource('ALL')" data-src="ALL" class="src-btn px-3 py-1.5 rounded-lg bg-sky-600 text-white font-semibold">All Live</button>
        <button onclick="setSource('X')" data-src="X" class="src-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300">X (Twitter)</button>
        <button onclick="setSource('NEWS')" data-src="NEWS" class="src-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300">Rajasthan News</button>
        <button onclick="setSource('YOUTUBE')" data-src="YOUTUBE" class="src-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300">YouTube TV</button>
        <button id="riskOnlyBtn" onclick="toggleRiskOnly()" class="px-3 py-1.5 rounded-lg bg-red-950/60 border border-red-700/50 text-red-300">
          Only Alerts / Negative
        </button>
      </div>
      <div class="flex items-center gap-2">
        <input id="instantSearch" oninput="renderFeed()" type="text" placeholder="Instant filter posts..."
          class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white w-52 focus:outline-none focus:border-sky-500" />
        <span id="postCount" class="text-xs text-slate-400">0 posts</span>
      </div>
    </div>

    <!-- Live Feed Stream -->
    <div id="feed" class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <div class="col-span-full text-center py-12 text-slate-400 text-sm">Loading live Rajasthan feeds...</div>
    </div>
  </main>

  <script>
    const DEFAULT_KEYWORDS = ["Bhajanlal", "RajCMO", "Rajasthan govt", "Jaipur", "paper leak", "RPSC"];
    let keywords = JSON.parse(localStorage.getItem("rajwatch_kw") || "null") || [...DEFAULT_KEYWORDS];
    let activeKeywordFilter = null;
    let currentSource = "ALL";
    let riskOnly = false;
    let soundOn = true;
    let allItems = [];
    let seenIds = new Set();
    let firstLoad = true;
    let countdown = 25;

    function playBeep(isAlert) {
      if (!soundOn) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = isAlert ? "sawtooth" : "sine";
        osc.frequency.value = isAlert ? 880 : 620;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, isAlert ? 320 : 160);
      } catch (e) {}
    }

    function toggleSound() {
      soundOn = !soundOn;
      const btn = document.getElementById("soundBtn");
      btn.textContent = soundOn ? "Sound: ON" : "Sound: OFF";
      btn.className = soundOn
        ? "px-3 py-1.5 rounded-lg bg-emerald-600/20 text-emerald-300 border border-emerald-500/40 font-semibold"
        : "px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 border border-slate-700";
      if (soundOn) playBeep(false);
    }

    function enableNotifications() {
      if (!("Notification" in window)) return alert("Ye browser desktop notifications support nahi karta.");
      Notification.requestPermission().then(p => {
        if (p === "granted") {
          document.getElementById("notifBtn").textContent = "Popup: ON";
          new Notification("RajWatch Live Ready", { body: "Naya Rajasthan update aate hi popup milega!" });
        }
      });
    }

    function renderKeywords() {
      const box = document.getElementById("kwChips");
      box.innerHTML = keywords.map(k => {
        const active = activeKeywordFilter === k;
        return `
          <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs cursor-pointer border ${
            active ? "bg-amber-500 text-slate-950 border-amber-400 font-bold" : "bg-slate-800/90 text-slate-200 border-slate-700 hover:border-sky-500"
          }" onclick="toggleKeywordFilter('${k.replace(/'/g, "\\'")}')">
            ${k}
            <button onclick="removeKeyword(event, '${k.replace(/'/g, "\\'")}')" class="ml-1 text-[10px] opacity-70 hover:opacity-100">✕</button>
          </span>`;
      }).join("");
    }

    function toggleKeywordFilter(k) {
      activeKeywordFilter = activeKeywordFilter === k ? null : k;
      renderKeywords();
      renderFeed();
    }

    function addKeyword(e) {
      e.preventDefault();
      const inp = document.getElementById("kwInput");
      const val = inp.value.trim();
      if (val && !keywords.includes(val)) {
        keywords.unshift(val);
        localStorage.setItem("rajwatch_kw", JSON.stringify(keywords));
        renderKeywords();
        fetchFeed(true);
      }
      inp.value = "";
    }

    function removeKeyword(e, k) {
      e.stopPropagation();
      keywords = keywords.filter(x => x !== k);
      if (activeKeywordFilter === k) activeKeywordFilter = null;
      localStorage.setItem("rajwatch_kw", JSON.stringify(keywords));
      renderKeywords();
      renderFeed();
    }

    function setSource(src) {
      currentSource = src;
      document.querySelectorAll(".src-btn").forEach(b => {
        const active = b.dataset.src === src;
        b.className = active
          ? "src-btn px-3 py-1.5 rounded-lg bg-sky-600 text-white font-semibold"
          : "src-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300";
      });
      renderFeed();
    }

    function toggleRiskOnly() {
      riskOnly = !riskOnly;
      const btn = document.getElementById("riskOnlyBtn");
      btn.className = riskOnly
        ? "px-3 py-1.5 rounded-lg bg-red-600 text-white font-semibold"
        : "px-3 py-1.5 rounded-lg bg-red-950/60 border border-red-700/50 text-red-300";
      renderFeed();
    }

    function timeAgo(ts) {
      const diff = Math.max(1, Math.floor(Date.now() / 1000 - ts));
      if (diff < 60) return `${diff}s ago`;
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      return `${Math.floor(diff / 86400)}d ago`;
    }

    function highlightText(txt) {
      let safe = txt.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      keywords.forEach(k => {
        if (k.length < 2) return;
        const re = new RegExp(`(${k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi");
        safe = safe.replace(re, `<mark class="bg-amber-400/25 text-amber-200 px-1 rounded">$1</mark>`);
      });
      return safe;
    }

    function renderFeed(newIdSet = new Set()) {
      const q = document.getElementById("instantSearch").value.trim().toLowerCase();
      const filtered = allItems.filter(item => {
        if (currentSource !== "ALL" && item.source !== currentSource) return false;
        if (riskOnly && item.risk !== "ALERT") return false;
        const hay = (item.text + " " + item.author).toLowerCase();
        if (activeKeywordFilter && !hay.includes(activeKeywordFilter.toLowerCase())) return false;
        if (q && !hay.includes(q)) return false;
        return true;
      });

      document.getElementById("postCount").textContent = `${filtered.length} posts`;
      const container = document.getElementById("feed");
      if (!filtered.length) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">Is filter par abhi koi post nahi mili.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isNew = newIdSet.has(item.id);
        const srcBadge = item.source === "X"
          ? `<span class="px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 border border-sky-500/30 font-bold">X LIVE</span>`
          : item.source === "YOUTUBE"
          ? `<span class="px-2 py-0.5 rounded bg-red-500/20 text-red-300 border border-red-500/30 font-bold">YOUTUBE</span>`
          : `<span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-bold">NEWS</span>`;
        const riskBadge = item.risk === "ALERT"
          ? `<span class="px-2 py-0.5 rounded bg-red-600 text-white font-bold">ALERT</span>` : "";
        const newBadge = isNew
          ? `<span class="px-2 py-0.5 rounded bg-amber-400 text-slate-950 font-extrabold animate-pulse">NEW</span>` : "";

        return `
          <article class="rounded-xl p-4 bg-[#0f172a] border ${item.risk === "ALERT" ? "border-red-500/50" : "border-slate-800"} hover:border-sky-500/50 transition ${isNew ? "new-flash" : ""}">
            <div class="flex items-center justify-between gap-2 text-[11px] mb-2">
              <div class="flex items-center gap-1.5 flex-wrap">${srcBadge} ${riskBadge} ${newBadge}</div>
              <span class="text-slate-400 font-medium">${timeAgo(item.ts)}</span>
            </div>
            <p class="text-xs font-semibold text-sky-300 mb-1">${item.author}</p>
            <p class="text-sm text-slate-100 leading-relaxed mb-3 break-words">${highlightText(item.text)}</p>
            <div class="flex items-center justify-between text-xs text-slate-400 pt-2 border-t border-slate-800/80">
              <span>${item.source === "X" ? `❤ ${item.likes} &nbsp; 🔁 ${item.retweets}` : "Real-Time Feed"}</span>
              <a href="${item.url}" target="_blank" class="text-sky-400 hover:underline font-semibold">Open Original ↗</a>
            </div>
          </article>`;
      }).join("");
    }

    async function fetchFeed(force = false) {
      countdown = 25;
      try {
        const res = await fetch(`/api/feed?keywords=${encodeURIComponent(keywords.join(","))}&force=${force}`);
        const data = await res.json();

        const xBadge = document.getElementById("xBadge");
        const xErr = document.getElementById("xErrorBox");
        if (data.x_status.startsWith("live")) {
          xBadge.textContent = `X: ${data.x_status.toUpperCase()}`;
          xBadge.className = "px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-semibold";
          xErr.classList.add("hidden");
        } else {
          xBadge.textContent = "X: Cookies Pending";
          xBadge.className = "px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 font-semibold";
          xErr.textContent = data.x_error || "News aur YouTube live chal raha hai. X live karne ke liye Render Environment mein X_AUTH_TOKEN aur X_CT0 add karein.";
          xErr.classList.remove("hidden");
        }

        const newIds = new Set();
        let hasAlert = false;
        let newestItem = null;
        data.items.forEach(item => {
          if (!seenIds.has(item.id)) {
            seenIds.add(item.id);
            if (!firstLoad) {
              newIds.add(item.id);
              if (!newestItem) newestItem = item;
              if (item.risk === "ALERT") hasAlert = true;
            }
          }
        });

        allItems = data.items;
        renderFeed(newIds);

        if (!firstLoad && newIds.size > 0) {
          playBeep(hasAlert);
          if ("Notification" in window && Notification.permission === "granted" && newestItem) {
            new Notification(`${newestItem.source} Update (${newestItem.author})`, { body: newestItem.text.slice(0, 120) });
          }
        }
        firstLoad = false;
      } catch (e) {
        console.error(e);
      }
    }

    renderKeywords();
    fetchFeed(false);
    setInterval(() => {
      countdown--;
      if (countdown <= 0) fetchFeed(false);
      document.getElementById("timer").textContent = countdown;
    }, 1000);
  </script>
</body>
</html>
